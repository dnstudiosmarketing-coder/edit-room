<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://nzrsxjmkucceqakusjyw.supabase.co; frame-src https://drive.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="The DN Studios team app: log briefs, keep to the deadline and submit finished videos.">
<meta name="theme-color" content="#E9E9E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DN Studios">
<title>DN Studios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="theme.js?v=6"></script>
<link rel="stylesheet" href="fonts.css?v=6">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <h1 class="brand"><span class="brand-mark">DN</span> Studios</h1>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
    <button class="who" id="who" type="button" aria-label="Your account" hidden></button>
  </div>
</header>

<main class="wrap main" id="main">
  <div class="stack" id="banners"></div>
  <div class="stack" id="view">
    <section class="section" aria-busy="true">
      <div class="empty"><strong>Opening DN Studios…</strong></div>
    </section>
  </div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-body">
    <h2 class="sheet-title" id="sheet-title"></h2>
    <div id="sheet-content"></div>
  </div>
</dialog>
<dialog class="player" id="player" aria-labelledby="player-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="wrap">DN Studios needs JavaScript switched on in your browser.</p></noscript>

<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
